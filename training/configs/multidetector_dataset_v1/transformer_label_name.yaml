# Compact encoder-only transformer — fine-grained 17-class target.
# Use when you need to distinguish individual Nb samples (e.g., separate
# rolled_up vs open Al blinds; panel orientation variants of plastic+wood).

model: transformer
target: label_name
release: release/multidetector_dataset_v1
run_name: transformer_label_name
models_dir: models/multidetector_dataset_v1

d_model: 96
depth: 4
heads: 4
mlp_ratio: 2
dropout: 0.15

epochs: 40
batch_size: 64
lr: 0.0003
weight_decay: 0.0001

noise_db: 0.5
channel_mask_p: 0.1   # less aggressive masking — fine-grained labels benefit from cleaner signal
seed: 42
