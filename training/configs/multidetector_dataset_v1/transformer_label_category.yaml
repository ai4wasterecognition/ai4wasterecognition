# Compact encoder-only transformer for multidetector_dataset_v1.
# Primary inference target: label_category (6 classes).
#
# Run:
#   python scripts/multidetector_dataset_v1/train_classifier.py \
#       --model transformer --target label_category --epochs 30

model: transformer
target: label_category
release: release/multidetector_dataset_v1
run_name: transformer_label_category
models_dir: models/multidetector_dataset_v1

# architecture
d_model: 64
depth: 4
heads: 4
mlp_ratio: 2
dropout: 0.1

# optimisation
epochs: 30
batch_size: 64
lr: 0.0003
weight_decay: 0.0001

# augmentation
noise_db: 0.5         # gaussian noise σ in dBm-equivalent
channel_mask_p: 0.2   # probability of zeroing one of the 4 channels per sample
seed: 42
