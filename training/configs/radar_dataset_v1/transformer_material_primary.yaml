dataset_dir: /path/to/local/radar_core_v1
task: material_primary
output_dir: runs/radar_dataset_v1/transformer_material_primary
seed: 42

training:
  epochs: 80
  batch_size: 128
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 15
  num_workers: 0

model:
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  patch_len: 4
  patch_stride: 2
  pooling: cls

split:
  column: split
  train: train
  val: val
  test: test
