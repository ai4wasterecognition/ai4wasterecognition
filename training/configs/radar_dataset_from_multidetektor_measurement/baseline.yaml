# Baseline scikit-learn classifier on radar_dataset_from_multidetektor_measurement.
# Default reference config; run from project root:
#   python scripts/radar_dataset_from_multidetektor_measurement/train_classifier.py \
#       --model baseline --algo logreg --feat both --target label_category

model: baseline
algo: logreg                       # logreg | rf
feat: both                         # hc (handcrafted) | flat | both
target: label_category             # label_category | label_name | label_contamination_present
release: release/radar_dataset_from_multidetektor_measurement
run_name: baseline_logreg_label_category
models_dir: models/radar_dataset_from_multidetektor_measurement

# Notes on feature space:
#   handcrafted = per-channel mean / std / max / argmax / target-bin mean (bin 7+8)
#                 / background-bin mean (bin 1+16+17) / delta target-bg / snr_db
#                 + cross-channel deltas (I1-I2, Q1-Q2)
#   flat        = raw flattened (4 * 17) = 68 values
#   both        = concatenation
